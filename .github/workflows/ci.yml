name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the action works against a fake bqto and a fake gcloud
        run: node test.mjs
      - name: the vendored bqto runs on this runner
        run: bin/bqto_linux_"$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')" version

  vendored:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bin/ holds the binaries of the bqto release in bin/checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/update.sh
          git diff --exit-code --stat -- bin/ || { echo "::error::bin/ differs from the bqto release in bin/checksums.txt"; exit 1; }
